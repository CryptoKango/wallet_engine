name: wallet_engine
description: Configurable multi-chain wallet engine for RPC, transaction building, signing, broadcasting, and receipts.
version: 0.1.0
publish_to: none
homepage: https://github.com/CryptoKango/wallet_engine
repository: https://github.com/CryptoKango/wallet_engine
issue_tracker: https://github.com/CryptoKango/wallet_engine

topics:
  - wallet
  - blockchain
  - web3
  - signing
  - rpc

environment:
  sdk: ^3.12.2
  flutter: '>=3.35.0'

dependencies:
  bip39: ^1.0.6
  blockchain_utils: ^7.1.0
  decimal: ^3.2.6
  dio: ^5.9.0
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  on_chain: ^8.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
        sharedDarwinSource: true
